[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentagon"
version = "0.1.3"
description = "Recursive self-improvement for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.txt"]
dependencies = [
    "click>=8.1,<9",
    "jsonschema>=4.21,<5",
    "referencing>=0.28.4,<1",
    "httpx>=0.28,<1",
    "gepa==0.1.4",
    "mcp>=1.25,<2",
]

[project.urls]
Homepage = "https://agentagon.ai"
Documentation = "https://agentagon.ai/docs/"
Source = "https://github.com/agentagon/agentagon"
Issues = "https://github.com/agentagon/agentagon/issues"
Changelog = "https://github.com/agentagon/agentagon/releases"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.16.6", "build>=1.2"]
browser = ["playwright==1.57.0"]
claude = ["claude-agent-sdk>=0.2.140,<0.3"]
credentials = ["keyring>=25,<26"]
e2b = ["e2b==2.51.0"]

[project.scripts]
agentagon = "agentagon.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentagon = ["dashboard/assets/*", "workflows/**/*.json", "workflows/**/*.md", "workflows/**/*.py", "workflows/**/*.cjs"]

[tool.setuptools.data-files]
"share/agentagon/contracts/v1" = ["contracts/v1/*.json"]
"share/agentagon/signals" = ["signals/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.per-file-target-version]
"src/agentagon/workflows/evaluate/helpers/*.py" = "py310"
