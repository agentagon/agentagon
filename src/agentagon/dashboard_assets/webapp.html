<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Agentagon · Your agent workspace</title>
  <link rel="icon" href="/logo-split-crown-96.png" type="image/png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/webapp.css">
  <script src="/webapp.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <div class="app-shell">
    <aside class="navigation" aria-label="Workspace navigation">
      <a class="brand" href="/" aria-label="Agentagon home"><img src="/logo-split-crown-96.png" alt="" width="34" height="34"><span>agentagon</span></a>
      <div class="project-picker"><label for="project-select">Project</label><select id="project-select"><option value="">Choose a project</option></select><button id="add-project" class="quiet-button" type="button">+ Add project</button></div>
      <div class="application-picker"><label for="application-agent-select">Application agent</label><select id="application-agent-select"><option value="">All application agents</option></select></div>
      <nav id="primary-nav" aria-label="Main"><button type="button" data-view="agents" aria-current="page"><span aria-hidden="true">◈</span>Agents</button><button type="button" data-view="overview"><span aria-hidden="true">◫</span>Goals</button><button type="button" data-view="design"><span aria-hidden="true">◇</span>Measurement plan</button><button type="button" data-view="eval"><span aria-hidden="true">▤</span>Eval</button><button type="button" data-view="fix"><span aria-hidden="true">↗</span>Fix</button><button type="button" data-view="metrics"><span aria-hidden="true">⌁</span>Metrics</button><button type="button" data-view="traces"><span aria-hidden="true">≋</span>Traces</button><button type="button" data-view="settings"><span aria-hidden="true">⚙</span>Settings</button></nav>
      <div class="navigation-bottom"><p class="local-indicator"><span aria-hidden="true"></span>Running on your computer</p></div>
    </aside>
    <div class="workspace-shell">
      <header class="topbar"><div class="breadcrumb"><span id="project-name">Your workspace</span><span aria-hidden="true">/</span><span id="application-agent-name" hidden></span><span id="current-view">Agents</span></div><div class="topbar-actions"><button id="activity-button" class="quiet-button" type="button">Activity <span id="activity-count" class="count">0</span></button><button id="refresh" class="quiet-button" type="button" aria-label="Refresh workspace">↻</button><button id="theme-toggle" class="quiet-button" type="button" aria-label="Switch to dark theme" hidden>◐</button><button id="agent-toggle" class="quiet-button" type="button" aria-expanded="true" aria-controls="agent-panel">Chat</button></div></header>
      <div class="work-area"><main id="main" tabindex="-1"><div id="notice" role="status" aria-live="polite" hidden></div><div id="page"><div class="empty-state"><h1>Opening your projects…</h1></div></div></main>
      <aside id="agent-panel" class="agent-panel" aria-label="Chat"><div class="agent-heading"><div><p class="eyebrow">Chat</p><h2 id="agent-name">Ready when you are</h2></div><span id="agent-activity" class="agent-activity" role="status" aria-live="polite" aria-atomic="true"><span id="agent-spinner" class="agent-spinner" aria-hidden="true" hidden></span><span id="agent-state" class="badge">Idle</span></span></div><label for="job-select" class="sr-only">Active task</label><select id="job-select"><option value="">No task selected</option></select><div id="agent-content"><div class="agent-empty"><span aria-hidden="true">✳</span><h3>No active task</h3></div></div></aside></div>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-dialog" class="quiet-button" type="button" aria-label="Close dialog">×</button></div><div id="dialog-content"></div></dialog>
</body>
</html>
